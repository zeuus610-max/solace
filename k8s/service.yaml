apiVersion: v1
kind: Service
metadata:
  name: solace-backend-service
  labels:
    app: solace-backend
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http-api
  selector:
    app: solace-backend
---
apiVersion: v1
kind: Service
metadata:
  name: solace-frontend-service
  labels:
    app: solace-frontend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http-web
  selector:
    app: solace-frontend
