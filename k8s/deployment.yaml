apiVersion: apps/v1
kind: Deployment
metadata:
  name: solace-backend-deployment
  labels:
    app: solace-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: solace-backend
  template:
    metadata:
      labels:
        app: solace-backend
    spec:
      containers:
        - name: backend
          image: solace-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: PHISHGUARD_DB_PATH
              value: "/data/solace.sqlite3"
            - name: ALLOWED_ORIGIN
              value: "http://127.0.0.1:8000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: solace-data-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solace-frontend-deployment
  labels:
    app: solace-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: solace-frontend
  template:
    metadata:
      labels:
        app: solace-frontend
    spec:
      containers:
        - name: frontend
          image: solace-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: solace-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
