apiVersion: v1
kind: Namespace
metadata:
  name: solace-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: solace-data
  namespace: solace-local
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solace-api
  namespace: solace-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solace-api
  template:
    metadata:
      labels:
        app: solace-api
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api
          image: appdeploy-solace-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: PHISHGUARD_DB_PATH
              value: /data/phishguard.sqlite3
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: solace-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: solace-local
spec:
  type: ClusterIP
  selector:
    app: solace-api
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solace-site
  namespace: solace-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solace-site
  template:
    metadata:
      labels:
        app: solace-site
    spec:
      containers:
        - name: site
          image: appdeploy-solace-solace-site:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /about.html
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /about.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: solace-site
  namespace: solace-local
spec:
  type: NodePort
  selector:
    app: solace-site
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30417
