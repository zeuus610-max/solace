services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    environment:
      PHISHGUARD_DB_PATH: /data/phishguard.sqlite3
    volumes:
      - solace-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  solace-site:
    build: .
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4174:80"
    restart: unless-stopped

volumes:
  solace-data:
